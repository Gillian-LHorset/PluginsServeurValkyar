name: ValkyarTownPlugin
version: '0.1.0'
main: fr.Valkyar.valkyarTownPlugin.ValkyarTownPlugin
api-version: '1.21'
authors: [ GG5 ]
description: TOWN - This plugin add the possibility to create city and join it.

depend: [DatabaseCommunicationAPI]

commands:
  town:
    description: Use for manage your town.
    usage: /<command> <argument> <argument>

permissions:
  town.mayor:
    description: Allow you to do everything in the town.
    default: op
    children:
      town.claim: true
      town.unclaim: true
      town.withdraw: true
      town.disband: true
  town.claim:
    description: Allow you to claim a chunk.
    default: op
  town.unclaim:
    description: Allow you to unclaim a chunk.
    default: op
  town.withdraw:
    description: Allow you to withdraw money from the town bank.
    default: op
  town.disband:
    description: Allow you to disband the town.
    default: op